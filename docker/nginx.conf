# Configuration nginx de SoFix Budget (copiée dans /etc/nginx/conf.d/default.conf)

server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Ne pas annoncer la version de nginx
    server_tokens off;

    # Le navigateur peut garder les fichiers en cache mais doit vérifier à chaque
    # chargement s'ils ont changé : une nouvelle version du site est vue immédiatement
    add_header Cache-Control "no-cache" always;

    # En-têtes de sécurité de base
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Fichiers et dossiers cachés (.git, .DS_Store...) : jamais servis
    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
