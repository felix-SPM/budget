<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>SoFix Budget</title>
  <link href="./style/icon.css" rel="stylesheet" />
   <link href="./style/style.css" rel="stylesheet" />
  <script src="./scripts/frontend/init.js" defer></script>
  <script src="./scripts/frontend/salaire.js" defer></script>
  <script src="./scripts/frontend/depenses.js" defer></script>
  <script src="./scripts/frontend/utilisateurs.js" defer></script>
  <script src="./scripts/backend/donnees.js" defer></script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js" defer></script>
  <script src="./scripts/backend/icon.js" defer></script>
  <script src="./scripts/backend/utilisateurs.js" defer></script>
</head>
<body>
    <h1 class="titreApp">SoFix Budget <i data-lucide="piggy-bank"></i></h1>
    <!-- PARTIE DE GESTION DES FICHIERS -->
    <div class="partie">
        <h2 class="titrePartie">Gestion des données <i data-lucide="file"></i></h2>
        <div class="bodyDonnees">
            <input type="file" id="jsonFileInput" hidden>
            <label for="jsonFileInput" class="btn-file">Choisir un fichier JSON <i data-lucide="folder-clock"></i></label>
            
            <input type="button" id="enregistrerDonnees" onclick="enregistrerDataJSON()" hidden>
            <label for="enregistrerDonnees" class="btn-file">Enregistrer <i data-lucide="save"></i></label>
        </div>
    </div>
    <!-- PARTIR CONFIG COMPTE ET UTILISATEURS-->
    <div class="partie">
        <h2 class="titrePartie">Configuration des utilisateurs <i data-lucide="user"></i> et comptes <i data-lucide="wrench"></i></h2>
        <div class="bodyComptesEtutilisateurs">
            <div class="utilisateurs">
                <h3>Utilisateurs</h3>
                <div class="listeUtilisateurs">

                </div>
                <div class="ajoutUtilisateurs">
                    <input id="inputNewUtilisateur" type="text" placeholder="Nom d'utilisateur"><button class="btnAddUser"><i data-lucide="circle-plus"></i></button>
                </div>
            </div>
            <div class="comptes">
                <div class="listeComptes">

                </div>
                <div class="ajoutCompte">
                    
                </div>
            </div>
        </div>
    </div>
    <!-- PARTIE REVENUS -->
    <div class="partie">
        <h2 class="titrePartie">Revenus <i data-lucide="hand-coins"></i></i></h2>
        <div class="zoneSaise">
            <label> Salaire Sophie : </label>
            <input type="number" id="salaireSophie" name="salaireSophie" /><br />
            <label> Salaire Félix : </label>
            <input type="number" id="salaireFelix" name="salaireFelix" /><br />
        </div>
        <div id="prorata">
        </div>
    </div>

    <!-- PARTIE DEPENSES -->
    <div class="partie">
        <h2 class="titrePartie">Dépenses <i data-lucide="receipt-euro"></i></h2>
        <div class="zoneDepenses">
        </div>
    </div>
        
</body>
</html>
