<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SoFix Budget</title>
  <link rel="icon" href="./img/icones/icone.svg" type="image/svg+xml" />
  <link rel="icon" href="./img/icones/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="./img/icones/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Budget" />
  <link href="./style/icon.css" rel="stylesheet" />
   <link href="./style/style.css" rel="stylesheet" />
  <script src="./scripts/frontend/init.js" defer></script>
  <script src="./scripts/frontend/revenus.js" defer></script>
  <script src="./scripts/frontend/repartition.js" defer></script>
  <script src="./scripts/frontend/enveloppes.js" defer></script>
  <script src="./scripts/frontend/cloture.js" defer></script>
  <script src="./scripts/frontend/depenses.js" defer></script>
  <script src="./scripts/frontend/utilisateurs.js" defer></script>
  <script src="./scripts/frontend/comptes.js" defer></script>
  <script src="./scripts/frontend/frontDonnees.js" defer></script>
  <script src="./scripts/backend/donnees.js" defer></script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="./scripts/backend/utilisateurs.js" defer></script>
  <script src="./scripts/backend/comptes.js" defer></script>
  <script src="./scripts/backend/revenus.js" defer></script>
  <script src="./scripts/backend/categories.js" defer></script>
  <script src="./scripts/backend/repartition.js" defer></script>
  <script src="./scripts/backend/enveloppes.js" defer></script>
  <script src="./scripts/backend/cloture.js" defer></script>
  <script src="./scripts/backend/backDepense.js" defer></script>
</head>
<body>
    <h1 class="titreApp">SoFix Budget <i data-lucide="piggy-bank"></i></h1>
    <!-- PARTIE DE GESTION DES FICHIERS -->
    <div class="partie">
        <h2 class="titrePartie">Gestion des données <i data-lucide="file"></i></h2>
        <div class="bodyDonnees">
            <div class="boutonDonnees">
                <input type="file" id="jsonFileInput" hidden>
                <label for="jsonFileInput" class="btn-file">Choisir un fichier JSON <i data-lucide="folder-clock"></i></label>
                
                <input type="button" id="enregistrerDonnees" onclick="enregistrerDataJSON()" hidden>
                <label for="enregistrerDonnees" class="btn-file">Enregistrer <i data-lucide="save"></i></label>
            </div>
            <div class="nomFichierDonnees">
                
            </div>
        </div>

    </div>
    <!-- PARTIR CONFIG COMPTE ET UTILISATEURS-->
    <div class="partie">
        <h2 class="titrePartie">Configuration des utilisateurs <i data-lucide="user"></i> et comptes <i data-lucide="wrench"></i></h2>
        <div class="bodyComptesEtutilisateurs">
            <div class="utilisateurs">
                <h3>Utilisateurs</h3>
                <div class="listeUtilisateurs">

                </div>
                <div class="ajoutUtilisateurs">
                    <input id="inputNewUtilisateur" type="text" placeholder="Nom d'utilisateur"><button class="btnAddUser"><i data-lucide="circle-plus"></i></button>
                </div>
            </div>
            <div class="comptes">
                <h3>Comptes</h3>
                <div class="listeComptes">

                </div>
                <div class="ajoutCompte">
                    <select id="selectProprietaireCompte" aria-label="Propriétaire du compte"></select>
                    <input id="inputNewCompte" type="text" placeholder="Intitulé du compte"><button class="btnAddCompte" aria-label="Ajouter le compte"><i data-lucide="circle-plus"></i></button>
                </div>
            </div>
        </div>
    </div>
    <!-- PARTIE REVENUS -->
    <div class="partie">
        <h2 class="titrePartie">Revenus <i data-lucide="hand-coins"></i></h2>
        <div class="zoneRevenus">
        </div>
        <div id="prorata">
        </div>
    </div>

    <!-- PARTIE DEPENSES -->
    <div class="partie">
        <h2 class="titrePartie">Dépenses <i data-lucide="receipt-euro"></i></h2>
        <div class="controlesDepenses">
            <button class="btnSupp toutDeplierCat" aria-label="Tout développer" title="Tout développer"><i data-lucide="chevrons-up-down"></i></button>
            <button class="btnSupp toutReplierCat" aria-label="Tout réduire" title="Tout réduire"><i data-lucide="chevrons-down-up"></i></button>
        </div>
        <div class="zoneDepenses">
        </div>
        <div class="ajoutCategorie">
            <input id="inputNewCategorie" type="text" placeholder="Nouvelle catégorie"><button class="btnAddCategorie" aria-label="Ajouter la catégorie"><i data-lucide="circle-plus"></i></button>
        </div>
    </div>

    <!-- PARTIE REPARTITION -->
    <div class="partie">
        <h2 class="titrePartie">Répartition <i data-lucide="arrow-left-right"></i></h2>
        <div class="zoneRepartition">
        </div>
    </div>

    <!-- PARTIE ENVELOPPES -->
    <div class="partie">
        <h2 class="titrePartie">Enveloppes <i data-lucide="mail"></i></h2>
        <div class="zoneEnveloppes">
        </div>
        <div class="ajoutEnveloppe">
            <select id="selectCompteEnveloppe" aria-label="Compte de la nouvelle enveloppe"></select>
            <input id="inputNewEnveloppe" type="text" placeholder="Nouvelle enveloppe"><button class="btnAddEnveloppe" aria-label="Ajouter l'enveloppe"><i data-lucide="circle-plus"></i></button>
        </div>
    </div>

    <!-- PARTIE CLOTURE -->
    <div class="partie">
        <h2 class="titrePartie">Clôture du budget <i data-lucide="lock"></i></h2>
        <div class="zoneCloture">
        </div>
    </div>

    <footer class="piedDePage">SoFix Budget · version <span class="numeroVersion"></span></footer>

    <script>
        lucide.createIcons()
    </script>
</body>
</html>
