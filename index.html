<!DOCTYPE html>
<html lang="fr">

<body>

        </div>

                        </tr>
                    </thead>
                    <tbody id="tabEntreesAssurances"></tbody>
                </table>
            </div>
        </div>
        <div id =>

        </div>
    </div>
  

  <input type="file" id="inputFichier" accept=".json,application/json" style="display:none">
